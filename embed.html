<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests">
  <title>OpenExpense embed</title>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      q.set('embed', '1');
      location.replace('/?' + q.toString());
    })();
  </script>
</head>
<body>
  <p>Opening the OpenExpense embed…</p>
</body>
</html>
